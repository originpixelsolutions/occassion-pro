version: '3.9'

# Development overrides — merge with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    build:
      target: development
    ports:
      - '3001:3001'
      - '9229:9229'   # Node.js debug port
    volumes:
      - ../../apps/api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3001
    command: pnpm run start:debug

  redis:
    ports:
      - '6379:6379'

  # Redis Commander UI for development
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - internal
