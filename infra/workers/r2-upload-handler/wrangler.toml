name = "occasionpro-r2-upload-handler"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://app.occasionpro.in,https://api.occasionpro.in"
MAX_FILE_SIZE_MB = "50"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "occasionpro-uploads"
preview_bucket_name = "occasionpro-uploads-preview"

[triggers]
routes = [
  { pattern = "uploads.occasionpro.in/*", zone_name = "occasionpro.in" }
]
